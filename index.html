<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Аскер Мунай — отчёты по добыче</title>
<style>
:root{color-scheme:light dark;--bg:#f3f4f6;--card:#fff;--ink:#1f3344;--ink2:#5a6672;--line:#d9dee3;--acc:#1f3344;--bad:#b23a3a}
@media (prefers-color-scheme:dark){:root{--bg:#111417;--card:#181c20;--ink:#e8edf2;--ink2:#a9b3bc;--line:#2f363e;--acc:#9cc0ee;--bad:#ef8080}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:15px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px}
h1{font-size:19px;margin:0 0 6px} p{color:var(--ink2);margin:0 0 18px;font-size:14px}
#pw{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
label.r{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--acc);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.wait{display:flex;gap:12px;align-items:center;color:var(--ink2);font-size:15px}
.sp{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .8s linear infinite;flex:none}
@keyframes r{to{transform:rotate(1turn)}}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
</style></head>
<body>
<div id="w" class="wait"><span class="sp"></span><span id="wt">Загрузка…</span></div>
<form id="f" autocomplete="off" style="display:none">
  <h1>🔒 Документ защищён паролем</h1>
  <p>Введите пароль, чтобы открыть отчёты.</p>
  <input id="pw" type="password" placeholder="Пароль" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
  <label class="r"><input id="sh" type="checkbox"> Показать пароль</label>
  <label class="r" style="margin-top:-8px"><input id="rm" type="checkbox"> Запомнить на этом устройстве</label>
  <button id="b">Открыть</button>
  <div class="err" id="e"></div>
</form>

const KEY = "enc:" + P.s;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);
const f=$("f"), pw=$("pw"), rm=$("rm"), b=$("b"), e=$("e"), sh=$("sh"), w=$("w"), wt=$("wt");
const get = st => { try { return st.getItem(KEY); } catch(_) { return null; } };
const put = (st,v) => { try { st.setItem(KEY, v); } catch(_) {} };
const del = () => { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch(_) {} };
let opener_key = null;   // вкладка «Открыть отдельно»: ключ берём из портала
try { if (window.opener && window.opener.location.origin === location.origin) opener_key = window.opener.sessionStorage.getItem(KEY); } catch(_) {}
const saved = get(sessionStorage) || get(localStorage) || opener_key;
function form(msg){ w.style.display="none"; f.style.display=""; if (msg) e.textContent = msg; if (window.top === window) pw.focus(); }
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, base, 256));
}
async function decrypt(raw){
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.n)}, k, b64(P.c)));
  if (!P.z) return new TextDecoder().decode(pt);
  if (window.DecompressionStream) { try { return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); } catch(_) {} }
  return new TextDecoder().decode(fflate.gunzipSync(pt));   // старые браузеры
}
function show(html){ document.open(); document.write(html); document.close(); }
sh.onchange = () => { pw.type = sh.checked ? "text" : "password"; };
async function auto(){
  if (!saved) return form();
  const t = setTimeout(() => { wt.textContent = "Открываю отчёт… (на телефоне может занять несколько секунд)"; }, 2500);
  try { const html = await decrypt(b64(saved)); clearTimeout(t); put(sessionStorage, saved); show(html); }
  catch(_) { clearTimeout(t); del(); form(); }
}
if (document.readyState === "complete") auto(); else window.addEventListener("load", auto);
f.onsubmit = async ev => {
  ev.preventDefault(); e.textContent = ""; b.disabled = true; b.textContent = "Проверка пароля…";
  try {
    if (!window.crypto || !crypto.subtle) throw {soft:"Браузер не поддерживает расшифровку. Откройте ссылку в Chrome (https://…)."};
    const raw = await derive(pw.value.trim());
    const html = await decrypt(raw);                       // неверный пароль дальше не пройдёт
    const k64 = btoa(String.fromCharCode(...raw));
    put(sessionStorage, k64); if (rm.checked) put(localStorage, k64);   // ключ сохраняем ДО показа страницы
    b.textContent = "Открываю…";
    setTimeout(() => show(html), 30);
  } catch(err) {
    e.textContent = err && err.soft ? err.soft : (err && err.name === "OperationError") ? "Неверный пароль. Проверьте заглавные буквы (включите «Показать пароль»)." : "Не удалось открыть: " + ((err && (err.name || err.message)) || "ошибка браузера") + ". Попробуйте Chrome.";
    b.disabled = false; b.textContent = "Открыть"; pw.select();
  }
};
})();
